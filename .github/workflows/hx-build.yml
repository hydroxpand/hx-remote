name: HX Remote build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to (e.g. hx-1.5.1-1)"
        required: true
        default: "hx-1.5.1-1"
  push:
    tags:
      - "hx-*"

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.tag || github.ref_name }}
      publish-update-metadata: false

  # HX: SHA256SUMS for the release, used by tools/i.ps1 and the auto-update task (tools/hxupdate.ps1).
  # The updater only picks releases that have this file, so it also marks a build as complete.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Write SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir dl && cd dl
          gh release download "$TAG" -R "${{ github.repository }}" -p 'rustdesk-*'
          sha256sum rustdesk-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS -R "${{ github.repository }}" --clobber
